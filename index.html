<!DOCTYPE html>
<html>
<head>
<title>Ashish Creations</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    font-family: Arial, sans-serif;
    margin: 20px;
    background: linear-gradient(to bottom, #1B1208, #2B1D0E);
    color: #F5EBD3;
}

h1{
    color: #D4AF37;
    text-align: center;
}

h2{
    color: #D4AF37;
}

button{
    background-color: #D4AF37;
    color: #111;
    padding: 12px 24px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin: 5px;
}

button:hover{
    background-color: #E6C65C;
}

#gallery{
    display: none;
}

#gallery img{
    max-width: 100%;
    width: 200px;
    margin: 5px;
    border-radius: 10px;
    border: 2px solid #D4AF37;
}

.photo-group{
    display: none;
    margin-top: 15px;
}

hr{
    border: 1px solid #D4AF37;
}

@media (max-width: 600px){
    h1{
        font-size: 24px;
    }

    p, li{
        font-size: 18px;
    }

    #gallery img{
        width: 100%;
    }
}
</style>

</head>

<body>

<h1>Welcome to My Website</h1>

<marquee style="font-size:20px; color:#F5EBD3" scrollamount="6">
Hello! My name is Ashish Pratap Singh Chauhan. I am learning web development.
</marquee>

<hr>

<h2>About Me</h2>
<p>I am a student and I love coding.</p>

<h2>My Skills</h2>

<ul>
<li>HTML</li>
<li>CSS</li>
<li>JavaScript</li>
</ul>

<h2>Gallery</h2>

<button id="toggleBtn" onclick="toggleGallery()">Show Photos</button>

<div id="gallery">

    <button onclick="showPhotos('ashish')">Ashish Thakur</button>
    <button onclick="showPhotos('bhavna')">Bhavna Thakur</button>
    <button onclick="showPhotos('shraddha')">Shraddha Thakur</button>
    <button onclick="showPhotos('sona')">Sona Thakur</button>
    <button onclick="showPhotos('akch')">Akch Thakur</button>

    <div id="ashish" class="photo-group">
        <img src="https://github.com/Ashish1231287680/my-website/blob/main/IMG_20250910_213834_093.webp?raw=true">
        <img src="https://github.com/Ashish1231287680/my-website/blob/main/IMG_20251128_194029_641_copy_2534x3675.jpg?raw=true">
    </div>

    <div id="bhavna" class="photo-group">
        <img src="https://github.com/Ashish1231287680/my-website/blob/main/IMG-20260601-WA0005.jpg?raw=true">
        <img src="https://github.com/Ashish1231287680/my-website/blob/main/IMG-20260601-WA0004.jpg?raw=true">
    </div>

    <div id="shraddha" class="photo-group">
        <!-- Add images later -->
    </div>

    <div id="sona" class="photo-group">
        <img src="https://github.com/Ashish1231287680/my-website/blob/main/IMG_20260509_125640_781.jpg?raw=true">
    </div>

    <div id="akch" class="photo-group">
        <img src="https://github.com/Ashish1231287680/my-website/blob/main/Bbabu.jpg?raw=true">
        <img src="https://github.com/Ashish1231287680/my-website/blob/main/IMG-20250907-WA0014.jpg?raw=true">
    </div>

</div>

<script>

function toggleGallery(){
    let gallery = document.getElementById("gallery");
    let button = document.getElementById("toggleBtn");

    if (gallery.style.display === "none" || gallery.style.display === ""){
        gallery.style.display = "block";
        button.innerText = "Hide Photos";
    } else {
        gallery.style.display = "none";
        button.innerText = "Show Photos";

        document.getElementById("ashish").style.display = "none";
        document.getElementById("bhavna").style.display = "none";
        document.getElementById("shraddha").style.display = "none";
        document.getElementById("sona").style.display = "none";
        document.getElementById("akch").style.display = "none";
    }
}

function showPhotos(person){

    document.getElementById("ashish").style.display = "none";
    document.getElementById("bhavna").style.display = "none";
    document.getElementById("shraddha").style.display = "none";
    document.getElementById("sona").style.display = "none";
    document.getElementById("akch").style.display = "none";

    document.getElementById(person).style.display = "block";
}

</script>

</body>
</html>
