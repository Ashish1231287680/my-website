<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ASHISH CREATIONS</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(-45deg,#0f172a,#1e293b,#4f46e5,#7c3aed);
background-size:400% 400%;
animation:bg 12s ease infinite;
min-height:100vh;
overflow-x:hidden;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.glass{
width:90%;
max-width:800px;
padding:50px;
text-align:center;

background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.2);

backdrop-filter:blur(20px);

border-radius:30px;

color:white;
box-shadow:0 0 40px rgba(255,255,255,.1);
}

.glass h1{
font-size:3rem;
margin-bottom:20px;
}

.glass p{
color:#ddd;
line-height:1.7;
margin-bottom:25px;
}

.btn{
padding:15px 35px;
border:none;
border-radius:50px;
font-size:18px;
cursor:pointer;

background:white;
color:#4f46e5;
font-weight:bold;

transition:.3s;
}

.btn:hover{
transform:scale(1.08);
box-shadow:0 0 25px white;
}

.gallery-dashboard{
display:none;
padding:80px 20px;
}

.gallery-dashboard h2{
text-align:center;
color:white;
font-size:2.5rem;
margin-bottom:40px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:25px;
max-width:1100px;
margin:auto;
}

.card{
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.2);
backdrop-filter:blur(20px);

border-radius:25px;
padding:40px 20px;

text-align:center;
color:white;

cursor:pointer;
transition:.4s;
}

.card:hover{
transform:translateY(-10px);
box-shadow:0 0 25px rgba(255,255,255,.2);
}

.card h3{
font-size:1.4rem;
}

.gallery-img{
width:100%;
max-width:300px;
height:220px;
object-fit:cover;
border-radius:20px;
cursor:pointer;
margin:auto;
display:block;
}

.gallery-img:hover{
transform:scale(1.05);
transition:.3s;
}

</style>
</head>

<body>

<section class="hero" id="home">

<div class="glass">

<h1>ASHISH CREATIONS</h1>

<p>
Welcome to my premium gallery website.
Modern design, smooth animations and
professional gallery experience.
</p>

<button class="btn" onclick="openDashboard()">
Explore Now
</button>

</div>

</section>

<section class="gallery-dashboard" id="dashboard">

<h2>Welcome to my Gallery </h2>

<div class="cards">

<div class="card" onclick="openCategory('ashish')">
<h3>Ashish</h3>
</div>

<div class="card" onclick="openCategory('bhavna')">
<h3>Bhavna</h3>
</div>

<div class="card" onclick="openCategory('sona')">
<h3>Sona</h3>
</div>

<div class="card" onclick="openCategory('veerpal')">
<h3>Mr. Veer Pal Singh Chauhan</h3>
</div>

<div class="card" onclick="openCategory('aksh')">
<h3>Aksh</h3>
</div>

</div>

</section>

<!-- ASHISH -->
<section id="ashish" class="gallery-dashboard">

<h2>Ashish Gallery</h2>

<button class="btn" onclick="backToDashboard()">Back</button>

<div class="cards">

<img src="https://github.com/Ashish1231287680/my-website/blob/main/IMG_20250910_213834_093.webp?raw=true" class="gallery-img" onclick="openViewer(this.src)">
<img src="https://github.com/Ashish1231287680/my-website/blob/main/IMG_20251128_194029_641_copy_2534x3675.jpg?raw=true" class="gallery-img" onclick="openViewer(this.src)">

</div>

</section>

<!-- IMAGE VIEWER -->

<div id="viewer" onclick="closeViewer()"
style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.95);
z-index:9999;
justify-content:center;
align-items:center;
padding:20px;
">

<img id="viewerImg"
style="
max-width:95%;
max-height:95%;
border-radius:20px;
">

</div>

<script>

function openDashboard(){

document.getElementById("home").style.display="none";

document.getElementById("dashboard").style.display="block";

document.getElementById("ashish").style.display="none";
document.getElementById("bhavna").style.display="none";
document.getElementById("sona").style.display="none";
document.getElementById("veerpal").style.display="none";
document.getElementById("aksh").style.display="none";

window.scrollTo(0,0);

}

function openCategory(name){

document.getElementById("dashboard").style.display="none";

document.getElementById("ashish").style.display="none";
document.getElementById("bhavna").style.display="none";
document.getElementById("sona").style.display="none";
document.getElementById("veerpal").style.display="none";
document.getElementById("aksh").style.display="none";

document.getElementById(name).style.display="block";

window.scrollTo(0,0);

}

function backToDashboard(){

document.getElementById("dashboard").style.display="block";

document.getElementById("ashish").style.display="none";
document.getElementById("bhavna").style.display="none";
document.getElementById("sona").style.display="none";
document.getElementById("veerpal").style.display="none";
document.getElementById("aksh").style.display="none";

window.scrollTo(0,0);

}

function openViewer(src){

document.getElementById("viewer").style.display="flex";

document.getElementById("viewerImg").src=src;

}

function closeViewer(){

document.getElementById("viewer").style.display="none";

}

</script>

</body>
</html>
